apiVersion: v1
kind: Service
metadata: {name: publisher-service, namespace: socialsync}
spec:
  selector: {app: publisher-service}
  ports: [{name: http, port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: publisher-service, namespace: socialsync}
spec:
  replicas: 1
  selector: {matchLabels: {app: publisher-service}}
  template:
    metadata: {labels: {app: publisher-service}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: publisher-service
          image: socialsync-publisher:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: socialsync-config}}]
          env:
            - name: INTERNAL_API_KEY
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: INTERNAL_API_KEY}}
            - name: LINKEDIN_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: LINKEDIN_ACCESS_TOKEN}}
            - name: LINKEDIN_AUTHOR_URN
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: LINKEDIN_AUTHOR_URN}}
            - name: FACEBOOK_PAGE_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: FACEBOOK_PAGE_ACCESS_TOKEN}}
            - name: FACEBOOK_PAGE_ID
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: FACEBOOK_PAGE_ID}}
            - name: INSTAGRAM_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: INSTAGRAM_ACCESS_TOKEN}}
            - name: INSTAGRAM_USER_ID
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: INSTAGRAM_USER_ID}}
            - name: YOUTUBE_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: YOUTUBE_ACCESS_TOKEN}}
          ports: [{name: http, containerPort: 8002}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, initialDelaySeconds: 15}
