apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: media-data, namespace: socialsync}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: media-service, namespace: socialsync}
spec:
  selector: {app: media-service}
  ports: [{name: http, port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: media-service, namespace: socialsync}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: media-service}}
  template:
    metadata: {labels: {app: media-service}}
    spec:
      securityContext: {fsGroup: 10001}
      initContainers:
        - name: wait-for-migrations
          image: socialsync-media:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: socialsync-config}}]
          env:
            - name: MEDIA_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: MEDIA_DB_PASSWORD}}
            - name: DATABASE_URL
              value: postgresql+psycopg://socialsync_media:$(MEDIA_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          command: [sh, -c, 'until python -c "from app.db import engine; from sqlalchemy import text; engine.connect().execute(text(\"SELECT 1 FROM media_svc.media_files LIMIT 1\"))"; do sleep 3; done']
      containers:
        - name: media-service
          image: socialsync-media:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: socialsync-config}}]
          env:
            - name: MEDIA_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: MEDIA_DB_PASSWORD}}
            - name: DATABASE_URL
              value: postgresql+psycopg://socialsync_media:$(MEDIA_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: socialsync-secrets, key: JWT_SECRET}}
          ports: [{name: http, containerPort: 8001}]
          volumeMounts: [{name: media-data, mountPath: /data}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, initialDelaySeconds: 15}
      volumes: [{name: media-data, persistentVolumeClaim: {claimName: media-data}}]
