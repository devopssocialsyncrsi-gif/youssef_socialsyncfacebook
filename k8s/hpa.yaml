apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: publisher-service, namespace: socialsync}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: publisher-service}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
