apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: socialsync}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: socialsync}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: socialsync-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, initialDelaySeconds: 10}
