apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialsync
  namespace: socialsync
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 210m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1000"
spec:
  ingressClassName: nginx
  rules:
    - host: socialsync.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 8080}}}
